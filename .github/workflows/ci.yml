name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Privacy scan
        run: python privacy/scan.py .
      - name: Install
        run: pip install -r database/requirements.lock -r mcp_server/requirements.txt
      - name: Database tests
        run: python -m unittest discover -s database/tests
      - name: Server tests
        run: python -m unittest discover -s mcp_server/tests -p 'test_*.py'
      - name: Plugin format
        run: |
          curl -fsSL -o /tmp/plugin.schema.json https://agent-plugins.org/schemas/1.0.0/plugin.schema.json
          curl -fsSL -o /tmp/mcp.schema.json https://agent-plugins.org/schemas/1.0.0/mcp.schema.json
          python - <<'PY'
          import json, re
          from pathlib import Path
          from jsonschema import Draft202012Validator
          root = Path('plugins/health-archive')
          for doc, schema in (('plugin.json', '/tmp/plugin.schema.json'), ('mcp.json', '/tmp/mcp.schema.json')):
              Draft202012Validator(json.load(open(schema))).validate(json.load(open(root / doc)))
          for skill in root.glob('skills/*/SKILL.md'):
              front = re.match(r'^---\n(.*?)\n---\n', skill.read_text(), re.S)[1]
              fields = dict(line.split(': ', 1) for line in front.splitlines())
              assert fields['name'] == skill.parent.name and 0 < len(fields['description']) <= 1024, skill
          print('plugin format valid')
          PY
